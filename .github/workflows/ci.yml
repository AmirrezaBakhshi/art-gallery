name: CI

permissions:
  contents: write

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-the-test-environment
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      GALLERY_SIGNUP_RATE: 1000/hour
      GALLERY_LOGIN_RATE: 1000/minute
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit
      - run: npm run lint
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-the-test-environment
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:5173
      CSRF_TRUSTED_ORIGINS: http://127.0.0.1:5173
      GALLERY_SIGNUP_RATE: 1000/hour
      GALLERY_LOGIN_RATE: 1000/minute
      VITE_API_BASE_URL: http://127.0.0.1:8000
      E2E_BASE_URL: http://127.0.0.1:5173
      CAPTURE_SHOWCASE: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'showcase/') && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright and Chromium
        run: |
          pip install playwright==1.56.0
          python -m playwright install chromium
      - name: Start Django API
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python manage.py runserver 127.0.0.1:8000 > /tmp/django.log 2>&1 &
      - name: Start Vite frontend
        working-directory: frontend
        run: npm run dev -- --host 127.0.0.1 > /tmp/vite.log 2>&1 &
      - name: Run browser end-to-end tests
        run: python frontend/e2e/test_gallery_workflow.py
      - name: Trim walkthrough and generate GIF
        if: success() && env.CAPTURE_SHOWCASE == '1'
        run: |
          PLAYWRIGHT_FFMPEG="$(find "$HOME/.cache/ms-playwright" -type f -name 'ffmpeg-linux' -print -quit)"
          test -n "$PLAYWRIGHT_FFMPEG"
          "$PLAYWRIGHT_FFMPEG" -y -i docs/showcase/videos/artgallery-walkthrough.webm -t 2.8 -c:v libvpx-vp9 -crf 35 -b:v 0 /tmp/artgallery-walkthrough-trimmed.webm
          mv /tmp/artgallery-walkthrough-trimmed.webm docs/showcase/videos/artgallery-walkthrough.webm
          "$PLAYWRIGHT_FFMPEG" -y -i docs/showcase/videos/artgallery-walkthrough.webm -vf "fps=6,scale=420:-1:flags=lanczos" -loop 0 docs/showcase/videos/artgallery-walkthrough.gif
      - name: Commit showcase assets to the PR branch
        if: success() && env.CAPTURE_SHOWCASE == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/showcase/
          git commit -m "Add ArtGallery visual showcase assets"
          git push origin "HEAD:$GITHUB_HEAD_REF"
      - name: Upload visual showcase
        if: success() && env.CAPTURE_SHOWCASE == '1'
        uses: actions/upload-artifact@v4
        with:
          name: artgallery-visual-showcase
          path: docs/showcase/
          if-no-files-found: error
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-e2e-diagnostics
          path: |
            /tmp/django.log
            /tmp/vite.log
