name: CI

permissions:
  contents: write

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key
          DJANGO_DEBUG: "true"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Update vulnerable dependencies
        run: npm audit fix --force
      - run: npm run lint
      - run: npm run build
      - name: Commit dependency updates
        if: github.ref == 'refs/heads/refactor/portfolio-ready' && github.event_name == 'push'
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency lockfile is already up to date."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "chore: update vulnerable frontend dependencies"
            git push
          fi
